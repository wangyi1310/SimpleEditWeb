name: Release

# 打 tag（v 开头，如 v3.5.0）自动触发多平台构建并发布 GitHub Release
# 产物：压缩包（zip/tar.gz）+ 未压缩裸二进制 + sha256 校验
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # macOS arm64 + x86_64 通用二进制
            platform: darwin/universal
            artifact: SimpleEditWeb-macos-universal
          - os: windows-latest    # Windows amd64
            platform: windows/amd64
            artifact: SimpleEditWeb-windows-amd64
          - os: ubuntu-latest     # Linux amd64
            platform: linux/amd64
            artifact: SimpleEditWeb-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Build (Linux, webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent SimpleEditWeb.app "${{ matrix.artifact }}.zip"
          cp SimpleEditWeb.app/Contents/MacOS/SimpleEditWeb "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\SimpleEditWeb.exe" -DestinationPath "build\bin\${{ matrix.artifact }}.zip"
          Copy-Item "build\bin\SimpleEditWeb.exe" "build\bin\${{ matrix.artifact }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czf "${{ matrix.artifact }}.tar.gz" SimpleEditWeb
          cp SimpleEditWeb "${{ matrix.artifact }}"

      - name: Generate checksum
        shell: bash
        run: |
          cd build/bin
          case "${{ runner.os }}" in
            Linux)   FILES="${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}" ;;
            Windows) FILES="${{ matrix.artifact }}.zip ${{ matrix.artifact }}.exe" ;;
            macOS)   FILES="${{ matrix.artifact }}.zip ${{ matrix.artifact }}" ;;
          esac
          sha256sum $FILES > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/SimpleEditWeb-*
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
